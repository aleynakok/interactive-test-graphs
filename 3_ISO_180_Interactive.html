<script>
function tabSwitch(id, mode) {
    const boxD = document.getElementById('box_d_' + id);

    const btnD = document.getElementById('btn_d_' + id);
    const btnP = document.getElementById('btn_p_' + id);
    
    if (mode === 'diag') {
        boxD.style.display = 'block';
        boxP.style.display = 'none';
        btnD.style.background = '#0284c7'; btnD.style.color = '#ffffff';
        btnP.style.background = 'transparent'; btnP.style.color = '#64748b';
        Plotly.Plots.resize('plot_' + id);
    } else {
        boxD.style.display = 'none';
        boxP.style.display = 'block';
        btnP.style.background = '#0284c7'; btnP.style.color = '#ffffff';
        btnD.style.background = 'transparent'; btnD.style.color = '#64748b';
    }
}
